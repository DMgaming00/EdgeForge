[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgeforge"
version = "0.1.0"
description = "Hardware-aware ML inference optimization and benchmarking on CPU"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy", "opencv-python-headless", "onnx", "onnxruntime", "pycocotools",
  "typer", "rich", "psutil", "torch", "torchvision",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# yolox is installed with: uv pip install --no-deps --no-build-isolation yolox
# (its sdist needs torch at build time; we only import yolox.models)

[project.scripts]
edgeforge = "edgeforge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs real weights/COCO data (run with -m integration)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E701", "E702", "B905"]
